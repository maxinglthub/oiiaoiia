<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oiiaoiia</title>

    <script>
        window.onload = function meme() {
            var playmusic = document.getElementById("play-music");
            var catmp3 = document.getElementById("cat");
            var catbutton = document.getElementById("catbutton");
            var backgroundchanging = document.getElementById("backgroundchange");
            
            backgroundchanging.addEventListener("mousedown", () => {
                catbutton.src = "catvdo.gif";
                catmp3.playAudio("cat.MP3");
            });

            backgroundchanging.addEventListener("mouseup", () => {
                catbutton.src = "catjpg.png";
                catmp3.pause();
                catmp3.currentTime = 0; // 從頭播放
            });

            backgroundchanging.addEventListener("mouseout", () => {
                catbutton.src = "catjpg.png";
                catmp3.pause();
                catmp3.currentTime = 0; // 從頭播放
            });
        }

    </script>


</head>

    <body style="background-image: url(catjpg.png);">
        <center>

            <div id="backgroundchange"><img id="catbutton" src="catjpg.png"></img></div>
